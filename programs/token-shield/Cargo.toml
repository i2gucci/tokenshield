[package]
name = "token-shield"
version = "0.1.0"
description = "DeFi insurance protocol for high-risk Solana tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_shield"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.16.0"
pyth-sdk-solana = "0.8.0"

[dev-dependencies]
solana-program-test = "1.16.0"
solana-sdk = "1.16.0"
spl-token = "3.5.0"  # Compatible with Solana 1.16, downgraded from 4.0 during dependency troubleshooting

